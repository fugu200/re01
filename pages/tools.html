<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具页面 - AI学习伙伴</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    body {
      padding: var(--spacing-lg);
      overflow-y: auto;
    }

    .tools-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--spacing-lg);
    }

    .tool-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      cursor: pointer;
      transition: var(--transition);
    }

    .tool-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 12px var(--shadow);
      border-color: var(--primary);
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      margin-bottom: var(--spacing-md);
      color: var(--primary);
    }

    .tool-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
      color: var(--text-primary);
    }

    .tool-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="tools-container">
    <div class="tools-grid">
      <!-- 1. 课表 -->
      <div class="tool-card" onclick="alert('课表功能待实现')">
        <svg class="tool-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="8" y="8" width="32" height="32" rx="2"/>
          <line x1="8" y1="16" x2="40" y2="16"/>
          <line x1="16" y1="8" x2="16" y2="40"/>
          <line x1="24" y1="16" x2="24" y2="40"/>
          <line x1="32" y1="16" x2="32" y2="40"/>
        </svg>
        <div class="tool-title">课表管理</div>
        <div class="tool-desc">显示当天/本周课表，支持导入课程安排</div>
      </div>

      <!-- 2. 提醒 -->
      <div class="tool-card" onclick="alert('提醒功能待实现')">
        <svg class="tool-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="24" cy="24" r="16"/>
          <polyline points="24 12 24 24 32 28"/>
        </svg>
        <div class="tool-title">智能提醒</div>
        <div class="tool-desc">导入课表/零碎事项，定时提醒，支持图片 OCR</div>
      </div>

      <!-- 3. 信息模块 -->
      <div class="tool-card" onclick="alert('信息模块待实现')">
        <svg class="tool-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="8" y="12" width="32" height="28" rx="2"/>
          <line x1="8" y1="20" x2="40" y2="20"/>
          <line x1="16" y1="28" x2="32" y2="28"/>
          <line x1="16" y1="34" x2="28" y2="34"/>
        </svg>
        <div class="tool-title">信息推荐</div>
        <div class="tool-desc">基于定位/需求推荐资讯资源（SQL 读写）</div>
      </div>

      <!-- 4. 专注模块 -->
      <div class="tool-card" onclick="alert('专注模块待实现')">
        <svg class="tool-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="24" cy="24" r="16"/>
          <circle cx="24" cy="24" r="8"/>
          <circle cx="24" cy="24" r="2" fill="currentColor"/>
        </svg>
        <div class="tool-title">专注模式</div>
        <div class="tool-desc">自习室 + 番茄钟 + 白噪音 + 打卡</div>
      </div>

      <!-- 5. 收藏 -->
      <div class="tool-card" onclick="alert('收藏功能待实现')">
        <svg class="tool-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M24 8L28 20H40L30 28L34 40L24 32L14 40L18 28L8 20H20L24 8Z"/>
        </svg>
        <div class="tool-title">资源收藏</div>
        <div class="tool-desc">文档/网页资源收藏（SQL 读写）</div>
      </div>

      <!-- 6. 笔记 -->
      <div class="tool-card" onclick="alert('笔记功能待实现')">
        <svg class="tool-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 8H36V40H12V8Z"/>
          <line x1="18" y1="16" x2="30" y2="16"/>
          <line x1="18" y1="24" x2="30" y2="24"/>
          <line x1="18" y1="32" x2="26" y2="32"/>
        </svg>
        <div class="tool-title">笔记编辑</div>
        <div class="tool-desc">Markdown 编辑 + 渲染</div>
      </div>

      <!-- 7. AI 出题 -->
      <div class="tool-card" onclick="alert('AI 出题功能待实现')">
        <svg class="tool-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="10" y="10" width="28" height="28" rx="2"/>
          <line x1="18" y1="20" x2="30" y2="20"/>
          <line x1="18" y1="26" x2="30" y2="26"/>
          <circle cx="14" cy="20" r="1" fill="currentColor"/>
          <circle cx="14" cy="26" r="1" fill="currentColor"/>
        </svg>
        <div class="tool-title">AI 出题</div>
        <div class="tool-desc">根据薄弱点/范围出题 → 作答 → 解析</div>
      </div>

      <!-- 8. 通知 -->
      <div class="tool-card" onclick="alert('通知功能待实现')">
        <svg class="tool-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 32C18 34.2091 19.7909 36 22 36H26C28.2091 36 30 34.2091 30 32"/>
          <path d="M12 28H36C36 28 38 28 38 26V18C38 13.5817 34.4183 10 30 10H18C13.5817 10 10 13.5817 10 18V26C10 28 12 28 12 28Z"/>
        </svg>
        <div class="tool-title">通知中心</div>
        <div class="tool-desc">番茄钟到时/上课/待办提醒统一通知</div>
      </div>
    </div>
  </div>

  <script>
    // 同步主题
    const parentTheme = window.parent.document.documentElement.getAttribute('data-theme');
    if (parentTheme) {
      document.documentElement.setAttribute('data-theme', parentTheme);
    }
  </script>
</body>
</html>
