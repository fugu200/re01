<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主页 - AI学习伙伴</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    body {
      padding: var(--spacing-lg);
      overflow-y: auto;
    }

    .home-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section {
      margin-bottom: var(--spacing-xl);
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--spacing-lg);
      color: var(--text-primary);
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
    }

    .tabs {
      display: flex;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-lg);
      border-bottom: 2px solid var(--border-color);
    }

    .tab {
      padding: var(--spacing-md) var(--spacing-lg);
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: var(--transition);
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      color: var(--primary);
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    .tab-content {
      display: none;
      padding: var(--spacing-lg);
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
    }

    .tab-content.active {
      display: block;
    }

    .placeholder {
      text-align: center;
      padding: var(--spacing-xl);
      color: var(--text-secondary);
    }

    .placeholder-icon {
      width: 64px;
      height: 64px;
      margin-bottom: var(--spacing-md);
      color: var(--text-tertiary);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="home-container">
    <!-- AI 学习伙伴交互区 -->
    <section class="section">
      <h2 class="section-title">AI 学习伙伴交互</h2>
      
      <div class="tabs">
        <button class="tab active" data-tab="learning">学习陪伴</button>
        <button class="tab" data-tab="growth">个人成长</button>
        <button class="tab" data-tab="summary">数据总结</button>
      </div>

      <!-- 学习陪伴 -->
      <div class="tab-content active" id="learning">
        <div class="placeholder">
          <svg class="placeholder-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="8" y="12" width="48" height="40" rx="2"/>
            <line x1="8" y1="20" x2="56" y2="20"/>
            <line x1="16" y1="28" x2="48" y2="28"/>
            <line x1="16" y1="36" x2="48" y2="36"/>
            <line x1="16" y1="44" x2="40" y2="44"/>
          </svg>
          <p>学习陪伴功能</p>
          <p style="font-size: 12px; margin-top: 8px; color: var(--text-tertiary);">在这里实现 AI 对话、学习辅导等功能</p>
        </div>
      </div>

      <!-- 个人成长 -->
      <div class="tab-content" id="growth">
        <div class="placeholder">
          <svg class="placeholder-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M32 48V32M32 32V16M32 32L20 24M32 32L44 24"/>
            <circle cx="32" cy="16" r="4"/>
            <circle cx="20" cy="24" r="4"/>
            <circle cx="44" cy="24" r="4"/>
            <circle cx="32" cy="48" r="4"/>
          </svg>
          <p>个人成长功能</p>
          <p style="font-size: 12px; margin-top: 8px; color: var(--text-tertiary);">在这里实现个人成长记录、目标管理等功能</p>
        </div>
      </div>

      <!-- 数据总结 -->
      <div class="tab-content" id="summary">
        <div class="placeholder">
          <svg class="placeholder-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="16" y1="48" x2="16" y2="32"/>
            <line x1="32" y1="48" x2="32" y2="20"/>
            <line x1="48" y1="48" x2="48" y2="28"/>
            <polyline points="8,24 16,16 32,28 48,12 56,20"/>
          </svg>
          <p>数据总结功能（账单周月报）</p>
          <p style="font-size: 12px; margin-top: 8px; color: var(--text-tertiary);">在这里实现学习数据统计、周报月报生成等功能</p>
        </div>
      </div>
    </section>
  </div>

  <script>
    // 标签页切换
    const tabs = document.querySelectorAll('.tab');
    const tabContents = document.querySelectorAll('.tab-content');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetTab = tab.dataset.tab;

        // 更新标签状态
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        // 更新内容显示
        tabContents.forEach(content => {
          if (content.id === targetTab) {
            content.classList.add('active');
          } else {
            content.classList.remove('active');
          }
        });
      });
    });

    // 同步主题
    const parentTheme = window.parent.document.documentElement.getAttribute('data-theme');
    if (parentTheme) {
      document.documentElement.setAttribute('data-theme', parentTheme);
    }
  </script>
</body>
</html>
