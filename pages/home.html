<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主页 - AI学习伙伴</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/chat.css">
  <link rel="stylesheet" href="../assets/css/growth.css">
  <link rel="stylesheet" href="../assets/css/report.css">
  <style>
    body {
      padding: var(--spacing-2xl);
      overflow-y: auto;
      background: var(--bg-secondary);
    }

    .home-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .section {
      margin-bottom: var(--spacing-2xl);
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: var(--spacing-lg);
      color: var(--text-primary);
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-2xl);
    }

    .stat-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      transition: var(--transition-fast);
    }

    .stat-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .stat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-desc {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .tabs {
      display: flex;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-lg);
      border-bottom: 2px solid var(--border-color);
    }

    .tab {
      padding: 12px 20px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: var(--transition-fast);
    }

    .tab:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .tab.active {
      color: var(--primary);
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    .tab-content {
      display: none;
      padding: var(--spacing-2xl);
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      min-height: 400px;
    }

    .tab-content.active {
      display: block;
    }

    .placeholder {
      text-align: center;
      padding: var(--spacing-2xl);
      color: var(--text-secondary);
    }

    .placeholder-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--spacing-lg);
      color: var(--text-tertiary);
      opacity: 0.4;
    }

    .placeholder-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
      color: var(--text-primary);
    }

    .placeholder-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="home-container">
    <!-- 快速概览 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon" style="background: var(--primary-light); color: var(--primary);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="stat-label">今日学习</div>
        </div>
        <div class="stat-value" style="color: var(--primary);">
          2.5 <span style="font-size: 16px; font-weight: 500; color: var(--text-secondary);">小时</span>
        </div>
        <div class="stat-desc">目标: 3小时 · 已完成 83%</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon" style="background: var(--success-light); color: var(--success);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="stat-label">本周任务</div>
        </div>
        <div class="stat-value" style="color: var(--success);">
          12 <span style="font-size: 16px; font-weight: 500; color: var(--text-secondary);">/ 15</span>
        </div>
        <div class="stat-desc">已完成 80% · 还剩 3 个任务</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon" style="background: var(--warning-light); color: var(--warning);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
          <div class="stat-label">学习连续</div>
        </div>
        <div class="stat-value" style="color: var(--warning);">
          7 <span style="font-size: 16px; font-weight: 500; color: var(--text-secondary);">天</span>
        </div>
        <div class="stat-desc">继续保持 · 创造新纪录</div>
      </div>
    </div>

    <!-- AI 学习伙伴交互区 -->
    <section class="section">
      <h2 class="section-title">AI 学习伙伴交互</h2>
      
      <div class="tabs">
        <button class="tab active" data-tab="learning">学习陪伴</button>
        <button class="tab" data-tab="growth">个人成长</button>
        <button class="tab" data-tab="summary">数据总结</button>
      </div>

      <!-- 学习陪伴 -->
      <div class="tab-content active" id="learning">
        <div id="learning">
  <!-- AI对话界面 -->
  <div class="chat-container">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="user-message" placeholder="输入你的问题...">
      <button id="send-button">发送</button>
      <button id="history-button">加载历史记录</button>
    </div>
  </div>
  
  <!-- 学习辅导功能 -->
  <div class="tutor-form" id="tutor-form">
    <select id="subject-select">
      <option value="">选择学科</option>
      <option value="math">数学</option>
      <option value="physics">物理</option>
      <option value="chemistry">化学</option>
    </select>
    <input type="text" id="question-input" placeholder="输入你的问题...">
    <button id="submit-question">提交</button>
    <div class="tutor-answer" id="tutor-answer"></div>
  </div>
</div>
        <div class="placeholder">
          <svg class="placeholder-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="8" y="12" width="48" height="40" rx="2"/>
            <line x1="8" y1="20" x2="56" y2="20"/>
            <line x1="16" y1="28" x2="48" y2="28"/>
            <line x1="16" y1="36" x2="48" y2="36"/>
            <line x1="16" y1="44" x2="40" y2="44"/>
          </svg>
          <div class="placeholder-title">学习陪伴功能</div>
          <div class="placeholder-desc">在这里实现 AI 对话、学习辅导等功能<br>可以添加聊天界面、问答系统等</div>
        </div>
      </div>

      <!-- 个人成长 -->
      <div class="tab-content" id="growth">
        <div id="growth">
  <!-- 成长记录 -->
  <div class="growth-form">
    <input type="date" id="growth-date" value="2024-01-01">
    <input type="text" id="growth-content" placeholder="成长内容...">
    <textarea id="growth-reflection" placeholder="心得体会..."></textarea>
    <button id="save-growth">保存</button>
  </div>
  <div class="growth-list" id="growth-list"></div>
  
  <!-- 目标管理 -->
  <div class="goal-list" id="goal-list"></div>
  <button id="add-goal">添加目标</button>
</div>
        <div class="placeholder">
          <svg class="placeholder-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M32 48V32M32 32V16M32 32L20 24M32 32L44 24"/>
            <circle cx="32" cy="16" r="4"/>
            <circle cx="20" cy="24" r="4"/>
            <circle cx="44" cy="24" r="4"/>
            <circle cx="32" cy="48" r="4"/>
          </svg>
          <div class="placeholder-title">个人成长功能</div>
          <div class="placeholder-desc">在这里实现个人成长记录、目标管理等功能<br>可以添加成长轨迹、里程碑记录等</div>
        </div>
      </div>

      <!-- 数据总结 -->
      <div class="tab-content" id="summary">
        <div id="summary">
  <div class="report-controls">
    <select id="report-period">
      <option value="weekly">周报</option>
      <option value="monthly">月报</option>
    </select>
    <button id="generate-report">生成报告</button>
    <button id="export-report">导出报告</button>
  </div>
  <div class="report-stats" id="report-stats"></div>
  <div class="report-chart" id="report-chart"></div>
</div>
        <div class="placeholder">
          <svg class="placeholder-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="16" y1="48" x2="16" y2="32"/>
            <line x1="32" y1="48" x2="32" y2="20"/>
            <line x1="48" y1="48" x2="48" y2="28"/>
            <polyline points="8,24 16,16 32,28 48,12 56,20"/>
          </svg>
          <div class="placeholder-title">数据总结功能（账单周月报）</div>
          <div class="placeholder-desc">在这里实现学习数据统计、周报月报生成等功能<br>可以添加图表展示、数据分析等</div>
        </div>
      </div>
    </section>
  </div>

  <script>

    // 标签页切换
    const tabs = document.querySelectorAll('.tab');
    const tabContents = document.querySelectorAll('.tab-content');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetTab = tab.dataset.tab;

        // 更新标签状态
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        // 更新内容显示
        tabContents.forEach(content => {
          if (content.id === targetTab) {
            content.classList.add('active');
          } else {
            content.classList.remove('active');
          }
        });
      });
    });

    // 同步主题
    const parentTheme = window.parent.document.documentElement.getAttribute('data-theme');
    if (parentTheme) {
      document.documentElement.setAttribute('data-theme', parentTheme);
    }
  </script>
  <script type="module" src="../assets/js/chat.js"></script>
  <script type="module" src="../assets/js/growth.js"></script>
  <script type="module" src="../assets/js/report.js"></script>

</body>
</html>
